services:
  # Backend Core (Go)
  - type: web
    name: rukito-api
    plan: free
    env: docker
    dockerContext: .
    dockerfilePath: rukito-backend/Dockerfile
    envVars:
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "3306"
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        sync: false
      - key: SERVER_PORT
        value: "8080"
      - key: PYTHON_SERVICE_URL
        value: http://rukito-analytics:8000

  # Analytics Service (Python)
  - type: web
    name: rukito-analytics
    plan: free
    env: docker
    dockerContext: .
    dockerfilePath: rukito-backend/analytics/Dockerfile
    envVars:
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "3306"
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        sync: false
